<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nouveau mot de passe - Courant Cash</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="nouveau mot de passe.css">
</head>

<body>

    <main class="new-password-page">

        <section class="new-password-box">

            <div class="icon-password">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1>
                Nouveau mot de passe
            </h1>

            <p class="description">
                Créez un nouveau mot de passe<br>
                pour sécuriser votre compte.
            </p>

            <form action="connexion.html">

                <div class="input-group">

                    <label for="new-password">
                        Nouveau mot de passe
                    </label>

                    <div class="input-container">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="new-password"
                            placeholder="Entrez votre nouveau mot de passe">

                    </div>

                </div>

                <div class="input-group">

                    <label for="confirm-password">
                        Confirmer le mot de passe
                    </label>

                    <div class="input-container">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirmez votre mot de passe">

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn-password">

                    Modifier le mot de passe

                </button>

            </form>

        </section>

    </main>

</body>

</html>
