
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compte créé - Courant Cash</title>

    <link rel="stylesheet" href="compte crée.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="success-page">

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

        <section class="success-content">

            <div class="logo-container">
                <img src="image/logo1.png" alt="Logo Courant Cash">
            </div>

            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <h1>Compte créé avec succès</h1>

            <p class="message">
                Félicitations ! Votre compte Courant Cash
                a été créé avec succès.
            </p>

            <p class="description">
                Vous pouvez maintenant accéder à votre
                espace personnel et utiliser nos services.
            </p>

            <a href="dashboard.html" class="btn-access">
                Accéder à mon compte
            </a>

        </section>

        <div class="bottom">
            <p>Une solution simple pour votre électricité</p>
        </div>

    </main>
