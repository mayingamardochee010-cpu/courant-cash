<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vérification - Courant Cash</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="verification.css">
</head>

<body>

    <main class="verification-page">

        <section class="verification-box">

            <div class="icon-verification">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <h1>
                Vérification
            </h1>

            <p class="description">
                Entrez le code de vérification<br>
                envoyé à votre numéro de téléphone.
            </p>

            <form id="verificationForm">

                <div class="otp-container">

                    <input type="text" maxlength="1" inputmode="numeric"
                        class="otp-input" autofocus>

                    <input type="text" maxlength="1" inputmode="numeric"
                        class="otp-input">

                    <input type="text" maxlength="1" inputmode="numeric"
                        class="otp-input">

                    <input type="text" maxlength="1" inputmode="numeric"
                        class="otp-input">

                    <input type="text" maxlength="1" inputmode="numeric"
                        class="otp-input">

                    <input type="text" maxlength="1" inputmode="numeric"
                        class="otp-input">

                </div>

                <p id="otpError" class="error"></p>


                <p class="resend-text">
                    Vous n'avez pas reçu le code ?
                </p>

                <a href="#" class="resend-code" id="resendCode">
                    Renvoyer le code
                </a>

                <p id="resendMessage"></p>


                <button
                    type="submit"
                    class="btn-verify">

                    Vérifier le code

                </button>

            </form>

        </section>

    </main>


    <script src="verification.js"></script>

</body>

</html>
