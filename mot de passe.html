<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mot de passe oublié - Courant Cash</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="mot de passe.css">
</head>

<body>

    <main class="forgot-page">

        <section class="forgot-box">

            <div class="icon-forgot">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1>
                Mot de passe oublié ?
            </h1>

            <p class="description">
                Entrez votre numéro de téléphone<br>
                pour recevoir un code de vérification.
            </p>

            <form action="verification.html">

                <div class="input-group">

                    <label for="telephone">
                        Numéro de téléphone
                    </label>

                    <div class="input-container">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            id="telephone"
                            placeholder="Entrez votre numéro"
                        >

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn-send">

                    Envoyer le code

                </button>

            </form>

        </section>

    </main>

</body>

</html>
