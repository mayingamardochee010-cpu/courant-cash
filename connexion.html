
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Courant Cash</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="connexion.css">
</head>

<body>

    <main class="connexion-page">

       <!--  <div class="logo">
            <img src="image/logo1.png" width="300PX">

        </div> -->

        <section class="connexion-box">

            <h1>
                Connexion
            </h1>

            <p class="welcome">
                Bienvenue ! connectez-vous<br>
                à votre compte
            </p>

            <form>

                <div class="input-group">

                    <label for="telephone">
                        Numéro de téléphone
                    </label>

                    <div class="input-container">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"name="" placeholder="Entrez votre numéro">

                    </div>

                </div>

                <div class="input-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <div class="input-container">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"name=""placeholder="Votre mot de passe">

                    </div>

                </div>

                <a href="mot de passe.html" class="forgot-password">
                    Mot de passe oublié ?
                </a>

                <button
                    type="submit"class="btn-login">

                    Se connecter

                </button>

            </form>

            <div class="separator">

                <span></span>

                <p>ou</p>

                <span></span>

            </div>

            <p class="no-account">
                Vous n'avez pas de compte ?
            </p>

            <a href="inscription.html" class="btn-register">
                Créer un compte
            </a>

        </section>

    </main>

</body>

</html>
